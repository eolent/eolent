name: Conformance runner

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  selftest:
    name: Runner self-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run conformance:selftest
      - name: Build the runner image
        run: docker build -f conformance/Dockerfile -t eolent-conformance .
